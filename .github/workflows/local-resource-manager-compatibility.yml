name: Local Resource Manager Adapter Compatibility

on:
  push:
    branches: [main]
    paths:
      - "runtime/reference-worker/immortal-resource-manager-adapter.mjs"
      - "runtime/reference-worker/immortal-resource-manager-adapter.test.mjs"
      - ".github/workflows/local-resource-manager-compatibility.yml"
  pull_request:
    branches: [main]
    paths:
      - "runtime/reference-worker/immortal-resource-manager-adapter.mjs"
      - "runtime/reference-worker/immortal-resource-manager-adapter.test.mjs"
      - ".github/workflows/local-resource-manager-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Local Resource Manager adapter contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check adapter syntax
        run: node --check runtime/reference-worker/immortal-resource-manager-adapter.mjs

      - name: Run adapter contract tests
        run: node --test runtime/reference-worker/immortal-resource-manager-adapter.test.mjs
