name: EXP boundary reference model

on:
  push:
    branches: ["**"]
    paths:
      - "verification/exp_boundary/**"
      - "verification/core_contracts/**"
      - "schemas/core/**"
      - "runtime/core/**"
      - ".github/workflows/exp-boundary-reference-model.yml"
  pull_request:
    branches: [main]
    paths:
      - "verification/exp_boundary/**"
      - "verification/core_contracts/**"
      - "schemas/core/**"
      - "runtime/core/**"
      - ".github/workflows/exp-boundary-reference-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-reference-model:
    name: Bounded Cormia Core and EXP contract checks (abstract models)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Core schema test dependency
        run: python -m pip install -r verification/core_contracts/requirements.txt
      - name: Run bounded EXP boundary tests
        run: python -m unittest discover -s verification/exp_boundary -p "test_*.py" -v
      - name: Run bounded Cormia Core contract tests
        run: python -m unittest discover -s verification/core_contracts -p "test_*.py" -v
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check Core Runtime modules
        run: |
          node --check runtime/core/project-lifecycle-reducer.mjs
          node --check runtime/core/project-lifecycle-journal.mjs
          node --check runtime/core/model-provider-contract.mjs
          node --check runtime/core/deterministic-model-provider.mjs
          node --check runtime/core/llama-cpp-model-provider.mjs
      - name: Run Project Lifecycle Runtime tests
        run: node --test runtime/core/*.test.mjs
