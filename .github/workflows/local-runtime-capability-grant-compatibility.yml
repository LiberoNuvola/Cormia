name: Local Runtime Capability Grant Contracts

on:
  push:
    branches: [main]
    paths:
      - "schemas/local-runtime-capability-grant-claims-v0.1.schema.json"
      - "schemas/local-runtime-capability-revocation-claims-v0.1.schema.json"
      - "schemas/local-host-authority-key-descriptor-v0.1.schema.json"
      - "schemas/local-operator-consent-claims-v0.1.schema.json"
      - "schemas/local-revocation-journal-event-v0.1.schema.json"
      - "schemas/local-revocation-checkpoint-claims-v0.1.schema.json"
      - "schemas/local-autonomous-project-mandate-claims-v0.1.schema.json"
      - "schemas/local-project-mandate-consent-claims-v0.1.schema.json"
      - "runtime/reference-worker/local-autonomous-project-mandate-schema.test.mjs"
      - "runtime/reference-worker/local-authority-lifecycle-schema.test.mjs"
      - "runtime/reference-worker/local-revocation-anchor-model.mjs"
      - "runtime/reference-worker/local-revocation-anchor-model.test.mjs"
      - "runtime/reference-worker/local-runtime-capability-grants.mjs"
      - "runtime/reference-worker/local-runtime-capability-grants.test.mjs"
      - ".github/workflows/local-runtime-capability-grant-compatibility.yml"
  pull_request:
    branches: [main]
    paths:
      - "schemas/local-runtime-capability-grant-claims-v0.1.schema.json"
      - "schemas/local-runtime-capability-revocation-claims-v0.1.schema.json"
      - "schemas/local-host-authority-key-descriptor-v0.1.schema.json"
      - "schemas/local-operator-consent-claims-v0.1.schema.json"
      - "schemas/local-revocation-journal-event-v0.1.schema.json"
      - "schemas/local-revocation-checkpoint-claims-v0.1.schema.json"
      - "schemas/local-autonomous-project-mandate-claims-v0.1.schema.json"
      - "schemas/local-project-mandate-consent-claims-v0.1.schema.json"
      - "runtime/reference-worker/local-autonomous-project-mandate-schema.test.mjs"
      - "runtime/reference-worker/local-authority-lifecycle-schema.test.mjs"
      - "runtime/reference-worker/local-revocation-anchor-model.mjs"
      - "runtime/reference-worker/local-revocation-anchor-model.test.mjs"
      - "runtime/reference-worker/local-runtime-capability-grants.mjs"
      - "runtime/reference-worker/local-runtime-capability-grants.test.mjs"
      - ".github/workflows/local-runtime-capability-grant-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Signed grant, attenuation and revocation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check syntax
        run: |
          node --check runtime/reference-worker/local-runtime-capability-grants.mjs
          node --check runtime/reference-worker/local-runtime-capability-grants.test.mjs
          node --check runtime/reference-worker/local-authority-lifecycle-schema.test.mjs
          node --check runtime/reference-worker/local-autonomous-project-mandate-schema.test.mjs
          node --check runtime/reference-worker/local-revocation-anchor-model.mjs
          node --check runtime/reference-worker/local-revocation-anchor-model.test.mjs

      - name: Parse claim schemas
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/local-runtime-capability-grant-claims-v0.1.schema.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/local-runtime-capability-revocation-claims-v0.1.schema.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/local-host-authority-key-descriptor-v0.1.schema.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/local-operator-consent-claims-v0.1.schema.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/local-revocation-journal-event-v0.1.schema.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/local-revocation-checkpoint-claims-v0.1.schema.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/local-autonomous-project-mandate-claims-v0.1.schema.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/local-project-mandate-consent-claims-v0.1.schema.json', 'utf8'))"

      - name: Run cryptographic and policy contract tests
        run: node --test runtime/reference-worker/local-runtime-capability-grants.test.mjs

      - name: Run local authority lifecycle schema contracts
        run: node --test runtime/reference-worker/local-authority-lifecycle-schema.test.mjs

      - name: Run autonomous project mandate schema contracts
        run: node --test runtime/reference-worker/local-autonomous-project-mandate-schema.test.mjs

      - name: Run revocation journal anchor state-machine tests
        run: node --test runtime/reference-worker/local-revocation-anchor-model.test.mjs
