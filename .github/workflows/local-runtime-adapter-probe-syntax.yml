name: Local Runtime Adapter Probe Syntax

on:
  push:
    branches: [main]
    paths:
      - "scripts/verify-local-runtime-adapters.mjs"
      - "runtime/reference-worker/immortal-agent-task-store-v1-adapter.mjs"
      - "runtime/reference-worker/local-evidence-sidecar-probe.mjs"
      - "runtime/reference-worker/immortal-resource-manager-adapter.mjs"
      - "runtime/reference-worker/immortal-evolution-manager-adapter.mjs"
      - ".github/workflows/local-runtime-adapter-probe-syntax.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify-local-runtime-adapters.mjs"
      - "runtime/reference-worker/immortal-agent-task-store-v1-adapter.mjs"
      - "runtime/reference-worker/immortal-resource-manager-adapter.mjs"
      - "runtime/reference-worker/immortal-evolution-manager-adapter.mjs"
      - ".github/workflows/local-runtime-adapter-probe-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Local probe syntax and adapter imports
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check probe syntax
        run: node --check scripts/verify-local-runtime-adapters.mjs

      - name: Check all local adapter syntax
        run: |
          node --check runtime/reference-worker/immortal-agent-task-store-v1-adapter.mjs
          node --check runtime/reference-worker/local-evidence-sidecar-probe.mjs
          node --check runtime/reference-worker/immortal-resource-manager-adapter.mjs
          node --check runtime/reference-worker/immortal-evolution-manager-adapter.mjs
          node --check runtime/reference-worker/immortal-coding-workspace-readonly-adapter.mjs

      - name: Import local adapters without executing a task
        run: |
          node --input-type=module -e "await import('./runtime/reference-worker/immortal-agent-task-store-v1-adapter.mjs'); await import('./runtime/reference-worker/local-evidence-sidecar-probe.mjs'); await import('./runtime/reference-worker/immortal-resource-manager-adapter.mjs'); await import('./runtime/reference-worker/immortal-evolution-manager-adapter.mjs'); await import('./runtime/reference-worker/immortal-coding-workspace-readonly-adapter.mjs'); console.log('All local adapters imported successfully.');"
